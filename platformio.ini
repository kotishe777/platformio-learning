; ESP32-S3 DevKitC-1 N16R8 — Arduino Core 3.x via pioarduino.
; Standard "platform = espressif32" provides only Arduino Core 2.0.17.

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- 16 MB Flash (N16) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- 8 MB PSRAM, octal (R8) ---
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1